name: cardio-minutes

on:
  schedule:
    - cron: "20 9 * * *"   # daily 9:20 UTC = 5:20 AM EDT / 4:20 AM EST
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: cardio-minutes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Opt-in: this job is skipped unless you set the repository variable
    # GARMIN_ENABLED to 'true' and add a GARMIN_TOKENS secret
    # (Settings -> Secrets and variables -> Actions).
    # See cardio-minutes-pipeline/CARDIO-MINUTES-SETUP.md for the full setup.
    if: vars.GARMIN_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect

      - name: Update cardio-minutes.csv
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python cardio-minutes-pipeline/cardio_minutes.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- cardio-minutes.csv; then
            echo "No changes."
            exit 0
          fi
          git config user.name "cardio-minutes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cardio-minutes.csv
          git commit -m "cardio-minutes: update $(date -u +%F)"
          git push
